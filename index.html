<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖВ 2532</title>
    <link rel="stylesheet" href="style_index.css">
</head>
<body>

    <header>
        <div class="logo">
            <span class="Text-name">Престиж Крест</span>
        </div>

        <nav>
            <a href="project.html">Проекты</a>
            <a href="services.html">Услуги</a>
            <a href="#">Контакты</a>
        </nav>

        <div class="header-spacer"></div>
    </header>

    <main>
        <div class="badge">КАТАЛОГ ПОСЕЛКА</div>
        <h1>Престиж Крест</h1>
        <p class="main-desc">
            поселок с душой, переносящий в беззаботное детство.<br>
            Он дарит те самые чувства, когда тебя маленького<br>
            привезли к бабушке в деревню.
        </p>
    </main>

    <section class="gallery-container">
        <div class="gallery-scroll" id="gallery">
            <div class="gallery-item"><img src="фото/дом1.png" alt="Фото 1"></div>
            <div class="gallery-item"><img src="фото/дом2.png" alt="Фото 2"></div>
            <div class="gallery-item"><img src="фото/дом3.png" alt="Фото 3"></div>
            <div class="gallery-item"><img src="фото/дом4.png" alt="Фото 4"></div>
        </div>

        <div class="gallery-controls">
            <button class="nav-btn" id="prevBtn">&#8592;</button>
            <button class="nav-btn" id="nextBtn">&#8594;</button>
        </div>
    </section>

    <script>
        const gallery = document.getElementById('gallery');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const scrollAmount = 450; 

        nextBtn.addEventListener('click', () => {
            gallery.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        });

        prevBtn.addEventListener('click', () => {
            gallery.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
        });
    </script>

</body>
</html>
